<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>公共采购密封投标</title>
<style>
body{font:15px/1.6 system-ui,sans-serif;max-width:1180px;margin:28px auto;padding:0 20px;color:#28343e}
table{border-collapse:collapse;width:100%;margin:14px 0}th,td{border:1px solid #d5dde3;padding:7px;vertical-align:top}
th{background:#eef4f7}.card{background:#eef8f3;border-left:5px solid #23845b;padding:12px 16px;margin-bottom:16px}
code{background:#edf0f2;padding:2px 5px}a{color:#1865a7}
.corr{background:#fdf3e7;border-left:5px solid #c87f1a;padding:12px 16px;margin:16px 0}
.muted{color:#6b7882;font-size:13px}.back{display:inline-block;margin-bottom:14px}
.tag{display:inline-block;padding:1px 8px;border-radius:10px;background:#e3edf5;font-size:12px}
.tag.corrected{background:#f7e0c2}.tag.original{background:#e3f1e8}
</style>
<h1>公共采购密封投标与评审</h1>
<div id="app"></div>
<script>
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,opts){const r=await fetch(path,opts);return r.json();}
function roundTime(){const v=new URLSearchParams(location.search).get('t');return v?parseInt(v,10):null;}

async function renderList(){
  const d=await api('/api/state');
  document.querySelector('#app').innerHTML=`
  <div class="card">公开页面只展示项目元数据，投标正文按角色和执行阶段隐藏。项目详情列出有效分值、评分更正记录与历史排名；写接口需要 <code>X-User</code>、<code>X-Role</code>。</div>
  <h2>采购项目</h2>
  <table><thead><tr><th>编号</th><th>标题</th><th>状态</th><th>截止时间</th><th>评审轮次</th><th>版本</th><th>详情</th></tr></thead><tbody>
  ${d.tenders.map(r=>`<tr><td>${esc(r.tender_no)}</td><td>${esc(r.title)}</td><td>${esc(r.status)}</td><td>${esc(r.deadline)}</td><td>${r.evaluation_round}</td><td>${r.version}</td><td><a href="?t=${r.id}">查看详情</a></td></tr>`).join('')}
  </tbody></table>
  <h2>投标元数据</h2>
  <table><thead><tr><th>项目</th><th>供应商</th><th>报价</th><th>状态</th><th>承诺哈希</th></tr></thead><tbody>
  ${d.bids.map(r=>`<tr><td><a href="?t=${r.tender_id}">${r.tender_id}</a></td><td>${r.vendor_id}</td><td>${r.price}</td><td>${esc(r.status)}</td><td>${esc(r.payload_hash).slice(0,12)}…</td></tr>`).join('')}
  </tbody></table>`;
}

const ACTION_LABEL={'score.corrected':'评分更正','tender.awarded':'授标定稿'};

async function renderDetail(id){
  const d=await api('/api/tenders/'+id);
  if(d.error){document.querySelector('#app').innerHTML=`<div class="card">${esc(d.error)}</div><a class="back" href="${location.pathname}">← 返回列表</a>`;return;}
  const t=d.tender,s=d.scoring;
  let html=`<a class="back" href="${location.pathname}">← 返回列表</a>
  <h2>${esc(t.title)} <span class="tag">${esc(t.status)}</span></h2>
  <div class="card">项目编号 ${esc(t.tender_no)} · 当前评审轮次 ${t.evaluation_round} · 版本 ${t.version} · 截止 ${esc(t.deadline)}<br>
  <span class="muted">规则、资料、数据与页面分开维护：评分换算与有效分值归并由 rules.py 统一计算，本页只展示结果。</span></div>`;

  if(!s){html+=`<p class="muted">项目尚未开标，评分信息暂不公开。</p>`;}
  else{
    html+=`<h3>当前有效排名（第 ${s.round} 轮，按有效分值实时重算）</h3>`;
    if(s.incomplete_bids.length){html+=`<p class="muted">以下投标评分尚未完成，不进入排名：${s.incomplete_bids.join(', ')}（评分未完不能授标）</p>`;}
    html+=`<table><thead><tr><th>名次</th><th>投标</th><th>供应商</th><th>报价</th><th>有效总分</th></tr></thead><tbody>`;
    s.ranking.forEach((r,i)=>{html+=`<tr><td>${i+1}</td><td>${r.bid_id}</td><td>${r.vendor_id}</td><td>${r.price}</td><td><strong>${r.score}</strong></td></tr>`;});
    html+=`</tbody></table>`;

    html+=`<h3>有效分值（原记录只读，接手人的更正为当前有效值）</h3>
    <table><thead><tr><th>投标</th><th>评分项</th><th>原评审人</th><th>原始录入</th><th>原始得分</th><th>当前有效人</th><th>有效录入</th><th>有效得分</th><th>状态</th></tr></thead><tbody>`;
    s.effective_scores.forEach(v=>{html+=`<tr>
      <td>${v.bid_id}</td><td>${esc(v.criterion)}</td>
      <td>${esc(v.original_evaluator)}</td><td>${v.original_raw_value}</td><td>${v.original_score.toFixed(2)}</td>
      <td>${esc(v.effective_evaluator)}</td><td>${v.raw_value}</td><td>${v.score.toFixed(2)}</td>
      <td>${v.corrected?'<span class="tag corrected">已更正</span>':'<span class="tag original">原记录</span>'}</td></tr>`;});
    html+=`</tbody></table>`;

    html+=`<h3>评分交接授权</h3>`;
    if(!s.handoffs.length){html+=`<p class="muted">暂无交接。监督员须先指定接手人并写明原因，接手人才能提交更正。</p>`;}
    else{html+=`<table><thead><tr><th>ID</th><th>轮次</th><th>原评审人</th><th>接手人</th><th>原因</th><th>状态</th><th>指定人</th><th>时间</th></tr></thead><tbody>`;
      s.handoffs.forEach(h=>{html+=`<tr><td>${h.id}</td><td>${h.evaluation_round}</td><td>${esc(h.original_evaluator)}</td><td>${esc(h.successor_evaluator)}</td><td>${esc(h.reason)}</td><td>${esc(h.status)}</td><td>${esc(h.designated_by)}</td><td>${esc(h.created_at)}</td></tr>`;});
      html+=`</tbody></table>`;}

    html+=`<h3>评分更正记录（旧值 / 新值 / 原因 / 处理时间全程留痕）</h3>`;
    if(!s.corrections.length){html+=`<p class="muted">暂无更正记录。</p>`;}
    else{html+=`<div class="corr"><table><thead><tr><th>ID</th><th>投标</th><th>评分项</th><th>原评审人</th><th>接手人</th><th>旧录入</th><th>新录入</th><th>旧得分</th><th>新得分</th><th>交接原因</th><th>监督员</th><th>处理时间</th></tr></thead><tbody>`;
      s.corrections.forEach(c=>{html+=`<tr><td>${c.id}</td><td>${c.bid_id}</td><td>${esc(c.criterion)}</td><td>${esc(c.original_evaluator)}</td><td>${esc(c.successor_evaluator)}</td><td>${c.old_raw_value}</td><td>${c.new_raw_value}</td><td>${c.old_score.toFixed(2)}</td><td>${c.new_score.toFixed(2)}</td><td>${esc(c.handoff_reason)}</td><td>${esc(c.authorized_by)}</td><td>${esc(c.processed_at)}</td></tr>`;});
      html+=`</tbody></table></div>`;}

    html+=`<h3>历史排名快照（可追查每次更正前后的排名变化）</h3>`;
    if(!s.ranking_history.length){html+=`<p class="muted">暂无历史快照。</p>`;}
    else{s.ranking_history.forEach((h,idx)=>{
      html+=`<p><span class="tag">${esc(ACTION_LABEL[h.trigger_action]||h.trigger_action)}</span> 第${h.evaluation_round}轮 · ${esc(h.created_by)} · ${esc(h.created_at)}</p>
      <table><thead><tr><th>名次</th><th>投标</th><th>供应商</th><th>报价</th><th>分值</th></tr></thead><tbody>`;
      h.ranking.forEach((r,i)=>{html+=`<tr><td>${i+1}</td><td>${r.bid_id}</td><td>${r.vendor_id}</td><td>${r.price}</td><td>${r.score}</td></tr>`;});
      if(!h.ranking.length){html+=`<tr><td colspan="5" class="muted">无可排名投标（未完评分：${(h.incomplete_bids||[]).join(', ')}）</td></tr>`;}
      html+=`</tbody></table>`;
    });}

    if(s.award_snapshot){
      const a=s.award_snapshot;
      html+=`<h3>授标快照（定稿依据）</h3><div class="card">第 ${esc(a.round)} 轮 · 授标给投标 ${a.winner.bid_id}（供应商 ${a.winner.vendor_id}，有效分 ${a.winner.score}）· 授标人 ${esc(a.awarded_by)} · ${esc(a.awarded_at)}<br><span class="muted">快照随有效分值固化；之后更正将被锁定，历史仍可通过上方快照追查。</span></div>`;
    }
  }
  document.querySelector('#app').innerHTML=html;
}

const tid=roundTime();
if(tid){renderDetail(tid);}else{renderList();}
</script></html>
